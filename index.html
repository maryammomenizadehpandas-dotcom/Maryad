/* چیدمان مرکزی عنوان مریاد، در تمام اندازه‌های صفحه */
.hero-in {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  min-height: 0;
  padding: 58px 0 53px;
  text-align: center;
}
.hero-in > div:first-child { width: 100%; text-align: center; }
.hero .eyebrow { justify-content: center; }
.hero .hero-en { text-align: center; }
.hero .hero-note { margin: 19px auto 0; max-width: 530px; }
.hero .hero-art { display: none; }
@media(max-width:660px) {
  .hero-in { display:flex; align-items:center; justify-content:center; padding: 38px 0 37px; text-align:center; }
  .hero-in > div:first-child { text-align:center; }
  .hero h1 { letter-spacing: -3px; }
  .hero .hero-note { font-size:12px; margin:15px auto 0; }
}


/* هویت رسمی مریاد: لوگوی مرکزی، آکادمی، نام کامل و امضای لاتین */
.hero .hero-in { min-height: 0; padding-block: 76px 73px; }
.hero h1 { font-size: clamp(76px, 10vw, 126px); letter-spacing: -4px; }
.hero .hero-sub { margin-top: 4px; font-size: clamp(17px, 2.4vw, 22px); }
.hero-full { margin: 17px 0 0; color: #d5bd82; font-size: clamp(11px, 1.8vw, 14px); line-height: 2.3; font-weight: 400; letter-spacing: .02em; }
.hero .hero-en { margin-top: 19px; letter-spacing: 9px; font-size: 20px; }
.foot-expand { color:#ad9e7c!important; font-size:11px!important; margin-top:2px!important; }
@media(max-width:660px) { .hero .hero-in { padding-block: 49px 51px; } .hero h1 { font-size: 77px; } .hero-full { max-width: 310px; margin-inline:auto; font-size:12px; } .hero .hero-en { letter-spacing:7px; font-size:17px; } }

<script id="content-data" type="application/json">[{"id":"g-758e682b2e5df23cd","cat":"poetry","title":"صد گل به باد رفت و گلابی ندید کس","excerpt":"صد گل به باد رفت و گلابی ندید کس / صد تاک خشک گشت و شرابی ندید کس","body":"::صد گل به باد رفت و گلابی ندید کس\nصد تاک خشک گشت و شرابی ندید کس\nباتشنگی بساز که در ساغرسپهر\nغیر از دل گداخته آبی ندیدکس\nآب حیات می طلبد حرص تشنه لب\nدر وادیی که موج سرابی ندید کس\nطی شد جهان واهل دلی از جهان نخاست\nدریا به ته رسید و سحابی ندید کس\nاین ماتم دگر که درین دشت آتشین\nدل آب گشت وچشم پرآبی ندید کس\nحرفی است این که خضر به آب بقا رسید\nزین چرخ دل سیه دم آبی ندید کس\nاز گردش فلک شب کوتاه زندگی\nزان سان بسر رسید که خوابی ندید کس\nاز دانش آنچه داد کم رزق می نهد\nچون آسمان درست حسابی ندید کس\nبشکن طلسم هستی خود راکه غیر از ین\nبر روی آن نگارنقابی ندیدکس\nباد غرور در سرحیران عشق نیست\nدر بحر آبگینه حبابی ندید کس\nصایب به هر که می نگرم مست و بیخودست\nهر چند ساقیی و شرابی ندید کس::","person":"صائب تبریزی","source":"https://ganjoor.net/saeb/divan-saeb/ghazalkasa/sh4851","feature":false,"publishedAt":"2026-11-06T11:49:48+00:00","auto":true},{"id":"g-4d55f6349b74a4d64","cat":"poetry","title":"این مطرب از کجاست که برگفت نام دوست","excerpt":"این مطرب از کجاست که برگفت نام دوست / تا جان و جامه بذل کنم بر پیام دوست","body":"::این مطرب از کجاست که برگفت نام دوست\nتا جان و جامه بذل کنم بر پیام دوست\nدل زنده می شود به امید وفای یار\nجان رقص می کند به سماع کلام دوست\nتا نفخ صور بازنیاید به خویشتن\nهر کاو فتاد مست محبت ز جام دوست\nمن بعد از این اگر به دیاری سفر کنم\nهیچ ارمغانیی نبرم جز سلام دوست\nرنجور عشق به نشود جز به بوی یار\nور رفتنی ست جان ندهد جز به نام دوست\nوقتی امیر مملکت خویش بودمی\nاکنون به اختیار و ارادت غلام دوست\nگر دوست را به دیگری از من فراغت ست\nمن دیگری ندارم قایم مقام دوست\nبالای بام دوست چو نتوان نهاد پای\nهم چاره آن که سر بنهی زیر بام دوست\nدرویش را که نام برد پیش پادشاه\nهیهات از افتقار من و احتشام دوست\nگر کام دوست کشتن سعدی ست باک نیست\nاینم حیات بس که بمیرم به کام دوست::","person":"سعدی","source":"https://ganjoor.net/saadi/divan/ghazals/sh100","feature":false,"publishedAt":"2026-11-06T11:49:52+00:00","auto":true},{"id":"p01","cat":"poetry","title":"الا یا ایها الساقی","excerpt":"غزل نخست دیوان حافظ؛ آغاز با وعدهٔ آسانی و رسیدن به دشواری عشق.","body":"::اَلا یا اَیُّهَا السّاقی اَدِرْ کَأساً و ناوِلْها\nکه عشق آسان نمود اوّل ولی افتاد مشکل‌ها\n\nبه بویِ نافه‌ای کآخِر صبا زان طُرّه بُگشاید\nز تابِ جَعدِ مشکینش چه خون افتاد در دل‌ها\n\nمرا در منزلِ جانان چه امنِ عیش، چون هر دَم\nجَرَس فریاد می‌دارد که بَربندید مَحمِل‌ها\n\nبه مِی سجّاده رنگین کُن گَرَت پیرِ مُغان گوید\nکه سالِک بی‌خبر نَبْوَد ز راه و رسمِ منزل‌ها::\n\n## خوانش کوتاه\nغزل از همان بیت نخست، تضاد میان تصور و تجربه را می‌سازد: عشق در آغاز آسان می‌نماید، اما راه که آغاز شد، دشواری خود را نشان می‌دهد. این تقابل در سراسر غزل ادامه پیدا می‌کند؛ میان آرزوی ماندن و بانگ حرکت، میان قرار و سفر.\n\n«جرس» زنگ کاروان است. وقتی در «منزل جانان» نیز بانگ کوچ شنیده می‌شود، آسودگی به امری ناپایدار بدل می‌شود. همین تصویر کوچک، بی‌قراری غزل را از یک احساس شخصی به موقعیتی نمایشی تبدیل می‌کند.\n\n## نکتهٔ متن‌شناختی\nضبط و نشانه‌گذاری ابیات در چاپ‌های مختلف دیوان حافظ یکسان نیست. برای مطالعهٔ دقیق‌تر باید نسخه و تصحیح مورد استفاده را مشخص کرد.","person":"حافظ","source":"https://ganjoor.net/hafez/ghazal/sh1","feature":true},{"id":"p02","cat":"poetry","title":"بشنو این نی چون شکایت می‌کند","excerpt":"چند بیت از آغاز مثنوی؛ تصویری از دوری، صدا و تمنای بازگشت.","body":"::بشنو این نی چون شکایت می‌کند\nاز جدایی‌ها حکایت می‌کند\n\nکز نِیِستان تا مرا بُبْریده‌اند\nدر نَفیرم مرد و زن نالیده‌اند\n\nسینه خواهم شَرحه‌شَرحه از فراق\nتا بگویم شرحِ دردِ اشتیاق\n\nهر کسی کو دور ماند از اصلِ خویش\nباز جوید روزگارِ وصلِ خویش::\n\n## چرا مثنوی با نی آغاز می‌شود؟\nنی هم شیئی واقعی است و هم نمادی برای خواندن تجربهٔ فراق. برای شنیدن صدای نی، پیش‌تر باید از نیستان بریده شده باشد. بنابراین «صدا» و «جدایی» از نخستین لحظه به هم پیوند می‌خورند.\n\nگوینده درخواست «سینهٔ شرحه‌شرحه» دارد؛ نه صرفاً شنونده‌ای که واژه‌ها را بفهمد، بلکه کسی که تجربهٔ فراق را بشناسد. در این‌جا شنیدن از فهمِ لغت فراتر می‌رود.\n\n## دربارهٔ اختلاف نسخه‌ها\nبیت آغازین مثنوی در روایت‌های شناخته‌شده صورت‌های متفاوتی دارد؛ از جمله «بشنو از نی چون حکایت می‌کند». متن بالا مطابق ضبط گنجور است و اختلاف نسخه‌ها را نباید اشتباهِ سادهٔ املایی دانست.","person":"مولانا","source":"https://ganjoor.net/moulavi/masnavi/daftar1/sh1","feature":true},{"id":"p03","cat":"poetry","title":"به نام خداوند جان و خرد","excerpt":"آغاز شاهنامه و جایگاه «خرد» در زبان فردوسی.","body":"::به نام خداوندِ جان و خرد\nکز این برتر، اندیشه، بر نگذرد\n\nخداوندِ نام و خداوندِ جای\nخداوندِ روزی‌دِهِ رهنمای\n\nخداوندِ کیوان و گَردان‌سپهر\nفروزندهٔ ماه و ناهید و مِهر\n\nز نام و نشان و گمان، برتر است\nنگارندهٔ بَرشده‌پیکر است::\n\n## دروازهٔ شاهنامه\nدر نخستین مصراع، «جان» و «خرد» کنار یکدیگر می‌نشینند. شاهنامه تنها روایت جنگ‌ها و پهلوانان نیست؛ بارها کردار قهرمانان را با سنجهٔ اندیشه و داوری می‌سنجد.\n\nستایش آغاز کتاب از نام و جای و سپهر می‌گذرد و سپس به محدودیت ادراک انسانی اشاره می‌کند. کنار هم قرار گرفتن شکوه کیهانی و ناتوانی اندیشه، به دیباچه عمق می‌دهد.\n\nخواندن شاهنامه از این چند بیت آغاز می‌شود، اما فهم لحن آن به توجه به تکرارها، واژگان کهن و وزن استوار متقارب وابسته است.","person":"فردوسی","source":"https://ganjoor.net/ferdousi/shahname/aghaz/sh1","feature":false},{"id":"p04","cat":"poetry","title":"بنی‌آدم اعضای یکدیگرند","excerpt":"چند بیت از گلستان سعدی دربارهٔ همدلی و مسئولیت انسانی.","body":"::بنی آدم اعضایِ یکدیگرند\nکه در آفرینش ز یک گوهرند\n\nچو عضوی به درد آورد روزگار\nدگر عضوها را نماند قرار\n\nتو کز محنتِ دیگران بی‌غمی\nنشاید که نامت نهند آدمی::\n\n## معنا در متن گلستان\nاین بیت‌ها در حکایتی از باب نخست گلستان آمده‌اند؛ بنابراین بهتر است جدا از موقعیت اخلاقی و اجتماعیِ حکایت خوانده نشوند. سعدی از پیوند انسان‌ها نتیجه‌ای عملی می‌گیرد: درد دیگری نمی‌تواند برای ما بی‌اهمیت باشد.\n\nقدرت تصویر در سادگی آن است. بدن، نمونه‌ای ملموس است: درد یک عضو، آرامش باقی را نیز به هم می‌زند. سعدی از این تجربهٔ آشنا پلی به مسئولیت اجتماعی می‌سازد.\n\nدر نسخه‌ها و نقل‌های عمومی، تفاوت «اعضای یکدیگرند» و «اعضای یک پیکرند» زیاد دیده می‌شود؛ ضبط منبع این مطلب «یکدیگرند» است.","person":"سعدی","source":"https://ganjoor.net/saadi/golestan/gbab1/sh10","feature":false},{"id":"p05","cat":"poetry","title":"این قافلهٔ عمر عجب می‌گذرد","excerpt":"رباعی خیام دربارهٔ زمان، شتاب عمر و ارزش اکنون.","body":"::این قافلهٔ عمر عجب می‌گذرد\nدریاب دمی که با طرب می‌گذرد\n\nساقی غم فردای حریفان چه خوری\nپیش آر پیاله را که شب می‌گذرد::\n\n## لحظه‌ای که از دست می‌رود\nتصویر قافله، زمان را به حرکتی بی‌توقف بدل می‌کند. در هر دو بیت، فعل «می‌گذرد» تکرار می‌شود؛ تکراری که خود به موسیقیِ ناپایداری می‌انجامد.\n\nرباعی فرمانِ سادهٔ شادی نیست. در پسِ آن آگاهیِ تلخی از کوتاهی فرصت قرار دارد. به همین دلیل طرب و اندوه در فضای چهار مصراع هم‌زمان حضور دارند.\n\n## دربارهٔ انتساب\nدر مجموعه‌های رباعیات خیام، انتساب برخی رباعی‌ها محل بحث متن‌شناختی است. این رباعی در گزیدهٔ فروغی و غنی نیز آمده است.","person":"خیام","source":"https://ganjoor.net/khayyam/robaee/sh66","feature":false},{"id":"p06","cat":"poetry","title":"ای ساربان آهسته رو","excerpt":"غزل سعدی؛ حرکت کاروان و ایستادن دل.","body":"::ای ساربان! آهسته رو کآرام جانم می‌رود\nوآن دل که با خود داشتم، با دل‌سِتانم می‌رود\n\nمن مانده‌ام مهجور از او، بیچاره و رنجور از او\nگویی که نیشی دور از او، در استخوانم می‌رود\n\nگفتم، به نیرنگ و فسون پنهان کنم ریشِ درون\nپنهان نمی‌ماند که خون، بر آستانم می‌رود::\n\n## چرا این غزل در حافظه می‌ماند؟\nهر مصراع دو بخشِ خوش‌آهنگ دارد؛ تکرار آوایی و حرکتِ روانِ عبارت‌ها با موضوع کاروان هماهنگ می‌شود. «می‌رود» در پایان مصراع‌ها هم خبرِ حرکت است و هم ضربانِ از دست دادن.\n\nشاعر رو به ساربان سخن می‌گوید، اما این گفت‌وگو عملاً درخواستِ توقفِ زمان است. کاروان می‌رود و گوینده می‌داند که نمی‌تواند رفتن را متوقف کند.\n\nاین غزل نمونهٔ خوبی برای شنیدن پیوند وزن، تکرار و معناست؛ بهتر است نخست با صدای بلند خوانده شود.","person":"سعدی","source":"https://ganjoor.net/saadi/divan/ghazals/sh268","feature":false},{"id":"p07","cat":"poetry","title":"بوی جوی مولیان آید همی","excerpt":"چند بیت از رودکی؛ بازآفرینی شور بازگشت به بخارا.","body":"::بویِ جویِ مولیان آیَد هَمی\nیادِ یارِ مهربان آیَد هَمی\n\nریگِ آموی و دُرشتی‌های او\nزیر پایم پَرنیان آیَد هَمی\n\nآبِ جیحون از نشاطِ روی دوست\nخِنگِ ما را تا میان آیَد هَمی\n\nای بخارا! شاد‌‌‌ باش و دیر زی\nمیر زیْ تو شادمان آیَد هَمی::\n\n## جغرافیایی که احساس می‌شود\nنام رود و شهر در این قطعه تنها نشانهٔ مکان نیست. ریگِ خشن در شور دیدار به پرنیان بدل می‌شود و آبِ جیحون نیز در چشمِ مشتاق صورتی دیگر می‌یابد.\n\nردیف «آید همی» حرکت و انتظار را تقویت می‌کند. به جای آن‌که شاعر بگوید «دلم تنگ شده»، شنونده صدا، بو و مسیر بازگشت را حس می‌کند.\n\nدربارهٔ اثر این شعر بر بازگشت امیر سامانی روایت مشهور تاریخی وجود دارد؛ خود شعر، مستقل از آن روایت، قدرت عاطفی کم‌نظیری دارد.","person":"رودکی","source":"https://ganjoor.net/roodaki/baghimande/sh121","feature":false},{"id":"p08","cat":"poetry","title":"در ازل پرتو حسنت","excerpt":"غزل حافظ؛ آفرینش عشق در زبان نور و آتش.","body":"::در ازل پرتوِ حُسنت ز تجلی دَم زد\nعشق پیدا شد و آتش به همه عالم زد\n\nجلوه‌ای کرد رُخَت دید مَلَک عشق نداشت\nعینِ آتش شد از این غیرت و بر آدم زد\n\nعقل می‌خواست کز آن شعله چراغ افروزد\nبرق غیرت بدرخشید و جهان برهم زد::\n\n## نور، آتش، عقل\nغزل صحنه‌ای پیش از زمان عادی می‌سازد: «ازل». در آن، عشق نه نتیجهٔ اتفاقی انسانی، بلکه رخدادی بنیادین است. آتش در این‌جا هم روشنایی دارد و هم سوزندگی.\n\nتضاد عقل و عشق به معنای نفیِ سادهٔ خرد نیست؛ حافظ نشان می‌دهد قلمرو این تجربه از توضیحِ حسابگرانه فراتر می‌رود. دقت در فعل‌های «دم زد»، «زد» و «برهم زد» حرکت شدید تصویرها را آشکار می‌کند.","person":"حافظ","source":"https://ganjoor.net/hafez/ghazal/sh152","feature":false},{"id":"p09","cat":"poetry","title":"سال‌ها دل طلب جام جم","excerpt":"حافظ و جست‌وجوی چیزی که از پیش با ما بوده است.","body":"::سال‌ها دل طلبِ جامِ جم از ما می‌کرد\nوآنچه خود داشت ز بیگانه تمنّا می‌کرد\n\nگوهری کز صدفِ کون و مکان بیرون است\nطلب از گمشدگانِ لبِ دریا می‌کرد\n\nمشکلِ خویش بَرِ پیرِ مُغان بُردم دوش\nکاو به تأییدِ نظر حلّ‌ِ معمّا می‌کرد::\n\n## وارونگیِ جست‌وجو\nقهرمان این غزل چیزی را بیرون از خود می‌جوید که سرانجام نشانی از آن را در درون می‌یابد. «جام جم» تصویرِ دیدن جهان است؛ اما حافظ آن را به پرسشِ شناختِ خویشتن پیوند می‌زند.\n\nبیت آغازین برای خوانندهٔ امروز نیز آشناست: گاهی پاسخ را از مرجعی دور می‌خواهیم، بی‌آن‌که به امکان‌های پیش رو توجه کنیم. با این همه، شعر صرفاً توصیه‌ای روان‌شناسانه نیست؛ شبکه‌ای از نمادهای عرفانی و داستانی دارد.","person":"حافظ","source":"https://ganjoor.net/hafez/ghazal/sh143","feature":false},{"id":"p10","cat":"poetry","title":"ز دست دیده و دل هر دو فریاد","excerpt":"دوبیتیِ منسوب به باباطاهر؛ فشردگی درد در چهار مصراع.","body":"::ز دست دیده و دل هر دو فریاد\nکه هر چه دیده بیند، دل کند یاد\n\nبسازم خنجری نیشش ز پولاد\nزنم بر دیده تا دل گردد آزاد::\n\n## دو عضو، یک گرفتاری\n«دیده» می‌بیند و «دل» به یاد می‌سپارد. ساده‌ترین رابطهٔ شناختی، در منطق عاشقانهٔ این دوبیتی به سرچشمهٔ رنج بدل می‌شود.\n\nاغراقِ مصراع پایانی خشونت واقعی را توصیه نمی‌کند؛ بیانِ شدتِ استیصالِ گوینده است. شعر با واژگان روزمره و زنجیرهٔ علت و معلول، نیروی عاطفی خود را می‌سازد.\n\nدوبیتی، با همهٔ کوتاهی‌اش، می‌تواند یک روایت کامل داشته باشد: دیدن، یاد کردن، رنج و آرزوی رهایی.","person":"باباطاهر","source":"https://ganjoor.net/babataher/2beytiha/sh23","feature":false},{"id":"p11","cat":"poetry","title":"ای نام تو بهترین سرآغاز","excerpt":"آغاز لیلی و مجنون نظامی؛ روانی زبان در وزن مثنوی.","body":"::ای نام تو بهترین سرآغاز\nبی‌نام تو نامه کی کنم باز\n\nای یاد تو مونس روانم\nجز نام تو نیست بر زبانم\n\nای کارگشای هر چه هستند\nنام تو کلید هر چه بستند::\n\n## آغاز با گفت‌وگو\nنظامی به جای توصیفی دور، خطاب مستقیم می‌آورد: «ای نام تو». تکرار «ای» و چرخشِ عبارت‌ها موسیقی نیایشی به شعر می‌دهد.\n\nدر کنار قافیه‌های نزدیک و وزن نرم، ترکیب «نامه باز کردن» دو معنا را زنده می‌کند: گشودن متن و آغازِ گفتن. این نمونه به‌خوبی نشان می‌دهد که یک مطلع چگونه لحنِ کل منظومه را آماده می‌کند.","person":"نظامی","source":"https://ganjoor.net/nezami/5ganj/leyli-majnoon/sh1","feature":false},{"id":"p12","cat":"poetry","title":"نکوهش مکن چرخ نیلوفری را","excerpt":"قصیدهٔ ناصرخسرو؛ دعوت از گلایهٔ سرنوشت به سوی مسئولیت.","body":"::نکوهش مکن چرخ نیلوفری را\nبرون کن ز سر باد و خیره‌سری را\n\nبری دان از افعال چرخ برین را\nنشاید ز دانا نکوهش بری را\n\nهم امروز از پشت، بارت بیفگن\nمیفگن به فردا مر این داوری را\n\nچو تو خود کنی اختر خویش را بد\nمدار از فلک چشم نیک اختری را::\n\n## تغییر جهت پرسش\nدر این شعر، «چرخ» متهمِ همیشگی بدبختی نیست. شاعر نگاه را از بخت بیرونی برمی‌گرداند و به کردار و انتخاب فرد معطوف می‌کند.\n\nلحنِ امری و واژگان قاطع، ویژگیِ برجستهٔ شعر تعلیمی ناصرخسرو است. برخلاف غزل عاشقانه که گاهی به ابهام تکیه دارد، این قصیده با مخاطب وارد مناظره می‌شود.","person":"ناصرخسرو","source":"https://ganjoor.net/naserkhosro/divann/ghaside-naser/sh6","feature":false},{"id":"p13","cat":"poetry","title":"آمد بهار جان‌ها","excerpt":"غزل مولانا؛ ریتمی که از خواندن به رقص می‌رسد.","body":"::آمد بهارِ جان‌ها ای شاخِ تَر به رقص آ\nچون یوسف اندر آمد، مصر و شکر به رقص آ\n\nای شاهِ عشق‌‌پرور‌، مانندِ شیرِ مادر\nای شیر، جو‌ش! در رو، جانِ پدر‌، به رقص آ\n\nچوگانِ زلف دیدی، چون گوی دررسیدی\nاز پا و سر بُریدی، بی‌پا و سر به رقص آ::\n\n## فرمانِ تکرارشونده\nردیف «به رقص آ» هر بار به تصویری تازه وصل می‌شود. گویی زبان، خواننده را از سکون بیرون می‌کشد و به یک کنش مشترک دعوت می‌کند.\n\nدر این غزل، تصویرها بیشتر با حرکت و جهش کنار هم می‌نشینند تا با زنجیرهٔ منطقیِ داستانی. به همین دلیل تجربهٔ شنیدن آن، بخشی جدایی‌ناپذیر از خواندن شعر است.","person":"مولانا","source":"https://ganjoor.net/moulavi/shams/ghazalsh/sh189","feature":false},{"id":"p14","cat":"poetry","title":"به جهان خرم از آنم","excerpt":"سعدی و تبدیلِ عشق فردی به نگاه مهربان به جهان.","body":"::به جهان خُرَّم از آنم که جهان خُرَّم از اوست\nعاشقم بر همه عالم که همه عالم از اوست\n\nبه غنیمت شِمُر ای دوست دمِ عیسیِ صبح\nتا دل مُرده مگر زنده کنی کاین دَم از اوست\n\nنَه فلک راست مُسَلَّم نَه مَلَک را حاصل\nآنچه در سِرِّ سُویدایِ بنی‌آدم از اوست::\n\n## از «او» تا همهٔ عالم\nردیف «از اوست» رشتهٔ پنهانِ ابیات است. هر تصویر، از صبح تا جهان و انسان، به سرچشمه‌ای واحد بازمی‌گردد و عشق را از یک نسبت خصوصی فراتر می‌برد.\n\nشعر با بیان ساده آغاز می‌شود اما پرسشی بزرگ دارد: آیا دوست داشتنِ جهان می‌تواند نتیجهٔ دوست داشتنِ حقیقتی بزرگ‌تر باشد؟ پاسخ سعدی در قالب تجربهٔ عاطفی و نه استدلال رسمی ارائه می‌شود.","person":"سعدی","source":"https://ganjoor.net/saadi/mavaez/ghazal2/sh13","feature":false},{"id":"p15","cat":"poetry","title":"آفرین جان‌آفرین پاک را","excerpt":"دیباچهٔ منطق‌الطیر عطار؛ از آفرینش تا سفر تمثیلی.","body":"::آفرین جان‌آفرین پاک را\nآن که جان بخشید و ایمان خاک را\n\nعرش را بر آب بنیاد او نهاد\nخاکیان را عمر بر باد او نهاد\n\nآسمان را در زبردستی بداشت\nخاک را در غایت پستی بداشت::\n\n## معماریِ تضادها\n«عرش» و «خاک»، «بالا» و «پایین»، «آب» و «باد» با هم می‌آیند تا از آغاز، جهانِ وسیعِ منطق‌الطیر را بسازند.\n\nبعدتر در داستان مرغان، این گستردگی به سفری درونی تبدیل می‌شود. دیباچه را می‌توان آماده‌سازیِ زبانِ کتاب دانست؛ زبانی که مفاهیم انتزاعی را با تصویرهای ملموس بیان می‌کند.","person":"عطار","source":"https://ganjoor.net/attar/manteghotteyr/touhid/sh1","feature":false},{"id":"p16","cat":"criticism","title":"چرا بیت اول مثنوی هنوز بحث‌برانگیز است؟","excerpt":"یک اختلاف نسخهٔ کوچک که راه‌های متفاوت خواندن را پیش می‌گذارد.","body":"## دو آغاز برای یک اثر\nدر بعضی نسخه‌ها و نقل‌ها می‌خوانیم «بشنو این نی چون شکایت می‌کند / از جدایی‌ها حکایت می‌کند» و در صورتِ مشهور دیگر «بشنو از نی چون حکایت می‌کند / وز جدایی‌ها شکایت می‌کند». این تفاوت فقط جابه‌جاییِ دو فعل نیست.\n\n## کانونِ توجه کجاست؟\nدر «بشنو این نی» گوینده چیزی را نشان می‌دهد: این نیِ حاضر. در «بشنو از نی» شنونده به روایتِ نی فراخوانده می‌شود. سپس نسبتِ حکایت و شکایت نیز تغییر می‌کند. هر دو خوانش به مضمون جدایی راه می‌برند، اما شروعشان یکسان نیست.\n\nبرای داوریِ نسخه‌شناختی، ذوق شخصی کافی نیست: باید دست‌نویس‌های کهن، تاریخ نسخه‌ها و روش مصححان را دید. در خواندن ادبی، خوب است اختلاف را پنهان نکنیم؛ گاهی خودِ اختلاف، معنای متن را روشن‌تر می‌کند.","person":"تحریریهٔ مریاد","source":"https://ganjoor.net/moulavi/masnavi/daftar1/sh1","feature":true},{"id":"p17","cat":"criticism","title":"«شب تاریک و بیم موج»؛ تنهایی در غزل حافظ","excerpt":"چطور یک تصویر دریایی به تجربه‌ای انسانی بدل می‌شود؟","body":"## ساحل و گرداب\nدر غزل نخست حافظ، «شب تاریک و بیم موج و گردابی چنین هایل» در برابر «سبک‌باران ساحل‌ها» قرار می‌گیرد. دو موقعیت از هم جدا می‌شوند: کسی که در میان خطر است و کسی که از دور تماشا می‌کند.\n\nاین‌جا شاعر از دریانوردی گزارشی واقعی نمی‌دهد. تصویر دریا، فاصلهٔ میان تجربهٔ درونی و قضاوت بیرونی را محسوس می‌کند. دشوار است کسی بیرونِ حادثه، سنگینیِ آن را همان‌طور بفهمد که گرفتار آن می‌فهمد.\n\n## چرا تصویر مؤثر است؟\nشعر به جای نام بردنِ مستقیم از تنهایی، شرایط آن را می‌چیند: تاریکی، موج، گرداب و ساحل. خواننده معنای عاطفی را از کنار هم نشستنِ این اشیا می‌سازد. این، یکی از راه‌های ماندگاری تصویر در شعر است.","person":"تحریریهٔ مریاد","source":"https://ganjoor.net/hafez/ghazal/sh1","feature":false},{"id":"p18","cat":"criticism","title":"سعدی چگونه اندوه را خوش‌آهنگ می‌کند؟","excerpt":"خوانشی از تکرار، موسیقی و حرکت در «ای ساربان».","body":"## واژه‌ای که مدام برمی‌گردد\nدر «ای ساربان آهسته رو»، عبارت «می‌رود» نه فقط ردیفِ آهنگین، بلکه هستهٔ عاطفی غزل است. با هر بازگشتِ آن، چیزی تازه از دست می‌رود: آرام جان، دل، نشان و توانِ ماندن.\n\n## رفتن در برابر ماندن\nداستانِ شعر ساده است: کاروان در حرکت و عاشق جا مانده است. اما سعدی با خطاب به ساربان، صحنه را به یک لحظهٔ زنده تبدیل می‌کند. خواننده فقط از واقعه خبر نمی‌گیرد؛ درخواستِ آهسته رفتن را می‌شنود.\n\nاگر غزل را بلند بخوانیم، مکث‌ها و قرینه‌های آوایی آن آشکار می‌شود. موسیقی این شعر از معنا جدا نیست؛ هم‌قدمِ حرکتِ کاروان پیش می‌رود.","person":"تحریریهٔ مریاد","source":"https://ganjoor.net/saadi/divan/ghazals/sh268","feature":false},{"id":"p19","cat":"criticism","title":"جام جم در شعر حافظ چه چیزی را نشان می‌دهد؟","excerpt":"از جام افسانه‌ای تا مسئلهٔ شناخت درونی.","body":"## نامی با گذشته‌ای داستانی\nجام جم در سنت ادبی به جامی جهان‌نما پیوند می‌خورد. حافظ این نشانهٔ آشنا را در غزل «سال‌ها دل طلب جام جم» به کار می‌گیرد، اما به جست‌وجویی درونی بدلش می‌کند.\n\n## درامِ یک سوءتفاهم\nبیت نخست بر تضادی روشن بنا شده است: طلب کردن از دیگری، چیزی را که خود داریم. ادامهٔ غزل با تصویر پیر مغان، آینه و حل معما این کشمکش را گسترش می‌دهد.\n\nنباید جام جم را فقط یک تعبیر ثابت و تک‌معنا دانست. ظرفیتِ شعر حافظ در آن است که تصویر می‌تواند هم یادآورِ اسطوره باشد، هم نشانهٔ بینش و هم زمینه‌سازِ پرسش از خویشتن.","person":"تحریریهٔ مریاد","source":"https://ganjoor.net/hafez/ghazal/sh143","feature":false},{"id":"p20","cat":"criticism","title":"آیا فردوسی فقط شاعر حماسه است؟","excerpt":"خرد، اندوه و تصمیم‌های دشوار در جهان شاهنامه.","body":"## بیش از صحنهٔ نبرد\nشاهنامه را اغلب با میدان جنگ و نام پهلوانان به یاد می‌آوریم، اما بسیاری از لحظه‌های تعیین‌کنندهٔ آن، لحظهٔ انتخاب‌اند. پهلوان باید میان پیوند خانوادگی، فرمان شاه و آنچه درست می‌پندارد تصمیم بگیرد.\n\n## لحنِ روایت\nفردوسی در کنار قدرت بدنی، بارها به خرد و رای اشاره می‌کند. آغاز شاهنامه با «جان و خرد» اتفاقی نیست؛ خواننده از همان ابتدا در جهانی قرار می‌گیرد که کردار باید سنجیده شود.\n\nبرای خواندن انتقادی شاهنامه، کافی نیست بپرسیم چه کسی پیروز شد. پرسش مهم‌تر آن است که هر شخصیت چه دانست، چه نمی‌دانست و تصمیم او چه پیامدی داشت. همین پرسش روایت کهن را امروز نیز زنده می‌کند.","person":"تحریریهٔ مریاد","source":"https://ganjoor.net/ferdousi/shahname/aghaz/sh1","feature":false},{"id":"p21","cat":"criticism","title":"بوی جوی مولیان؛ چگونه شعر نوستالژی می‌سازد؟","excerpt":"وقتی خاطره با بو، صدا و نامِ مکان بازمی‌گردد.","body":"## حافظه از راه حس‌ها\nرودکی نمی‌گوید «یاد گذشته افتادم». او نخست بو را احضار می‌کند، بعد نامِ جوی، یار و بخارا را. خاطره در این شعر نه انتزاعی، بلکه جسمانی است.\n\n## نرم شدنِ دشواری\n«ریگ آموی» زبر است، اما زیر پای مشتاق «پرنیان» می‌شود. تصویر، واقعیت جغرافیایی را حذف نمی‌کند؛ نشان می‌دهد اشتیاق چگونه دریافتِ ما از جهان را تغییر می‌دهد.\n\nردیف «آید همی» حالتی از نزدیک شدن پی‌درپی دارد. شعر به شنونده حس می‌دهد چیزی محبوب در راه است. به همین دلیل حتی بدون شناخت همهٔ زمینه‌های تاریخی نیز اثر خود را می‌گذارد.","person":"تحریریهٔ مریاد","source":"https://ganjoor.net/roodaki/baghimande/sh121","feature":false},{"id":"p22","cat":"criticism","title":"عشق و عقل در «در ازل پرتو حسنت»","excerpt":"خواندن یک دوگانهٔ قدیمی بدون ساده‌سازی آن.","body":"## آتش به جای تعریف\nحافظ برای تعریف عشق، تصویرِ آتش را انتخاب می‌کند: چیزی که می‌تابد، روشن می‌کند و می‌سوزاند. عشق در بیت آغاز، رخدادی فراگیر است نه گزاره‌ای انتزاعی.\n\n## عقل در مقامِ بیننده\nدر بیت «عقل می‌خواست کز آن شعله چراغ افروزد»، خرد می‌خواهد از تجربهٔ نور بهره بگیرد. اما برقِ غیرت رخ می‌دهد و صحنه برهم می‌خورد. این جدال نمایشی از شرحی خطی اثرگذارتر است.\n\nخواننده می‌تواند از این تضاد برداشت‌های گوناگون داشته باشد. نقد خوب زمانی آغاز می‌شود که پیش از تحمیل نتیجه، به واژه‌های خود شعر گوش کنیم.","person":"تحریریهٔ مریاد","source":"https://ganjoor.net/hafez/ghazal/sh152","feature":false},{"id":"p23","cat":"criticism","title":"پرندگان منطق‌الطیر چه نماینده‌اند؟","excerpt":"تمثیل، سفر و امکانِ خواندن چندلایهٔ عطار.","body":"## داستانی فراتر از پرندگان\nدر منطق‌الطیر، پرندگان شخصیت‌های داستان‌اند، اما رفتار و گفت‌وگویشان به خصلت‌ها و تردیدهای انسانی اشاره می‌کند. تمثیل این امکان را می‌دهد که امر دشوارِ معنوی در قالب صحنه و مکالمه دیده شود.\n\n## سفرِ بیرون و درون\nمسیرِ جمعی مرغان را می‌توان داستانِ جست‌وجو خواند. هر بهانه یا هراس در مسیر، در سطحی دیگر یک مانعِ درونی است. خواندنِ صرفاً لفظی قصه بخشی از آن را از دست می‌دهد؛ خواندنِ صرفاً نمادین نیز لذت روایت را کم می‌کند.\n\nبهتر است هر دو سطح را نگه داریم: پرنده‌ای در داستان سخن می‌گوید، و هم‌زمان چیزی از آدمی آشکار می‌شود.","person":"تحریریهٔ مریاد","source":"https://ganjoor.net/attar/manteghotteyr/touhid/sh1","feature":false},{"id":"p24","cat":"criticism","title":"چرا سعدی هنوز معاصر به نظر می‌رسد؟","excerpt":"نکته‌ای دربارهٔ ایجاز، موقعیت و گفت‌وگو در نثر گلستان.","body":"## نخست صحنه، بعد نتیجه\nدر بسیاری از حکایت‌های گلستان، خواننده پیش از روبه‌رو شدن با داوریِ اخلاقی، وارد موقعیتی ملموس می‌شود. شخصیت حرفی می‌زند، کنشی می‌کند و پیامد آن نمایان می‌شود.\n\n## زبانِ اندازه‌گیری‌شده\nسعدی جمله را به‌اندازه پیش می‌برد. تقابل‌ها، آهنگِ نثر و ضرب‌المثل‌وار شدنِ بعضی عبارت‌ها سبب می‌شود متن آسان به حافظه سپرده شود.\n\nاما معاصر بودن به معنیِ هم‌نظر بودن با همهٔ مفاهیم امروز نیست. نقدِ منصفانه باید هم زیباییِ ساختار را ببیند و هم فاصلهٔ تاریخیِ ارزش‌ها و مناسباتِ اجتماعی را.","person":"تحریریهٔ مریاد","source":"https://ganjoor.net/saadi/golestan/gbab1/sh10","feature":false},{"id":"p25","cat":"criticism","title":"آیا شعر خوب باید دشوار باشد؟","excerpt":"دشواریِ زبانی را از پیچیدگیِ تجربه جدا کنیم.","body":"## دشواری دو صورت دارد\nگاه شعر به دلیلِ واژه‌ها و ارجاع‌های ناآشنا دشوار می‌شود. گاهی واژه‌ها ساده‌اند اما رابطهٔ تصویرها یا تجربهٔ بیان‌شده لایه‌های متعددی دارد. این دو را نباید یکی دانست.\n\n## نمونه‌های روشن\nدوبیتی باباطاهر با واژه‌های ساده رنجی عمیق می‌سازد؛ غزل حافظ ممکن است با شبکه‌ای از نمادها خوانش‌های متفاوت بخواهد. هیچ‌یک صرفاً به سببِ سادگی یا پیچیدگی برتر نمی‌شود.\n\nیک پرسش راهگشاست: آیا دشواریِ متن برای ساختنِ معنایی تازه لازم است، یا فقط مانعی میان شعر و خواننده شده؟ پاسخ را باید از خودِ متن و نه از شهرت شاعر پیدا کرد.","person":"تحریریهٔ مریاد","source":"https://ganjoor.net/babataher/2beytiha/sh23","feature":false},{"id":"p26","cat":"criticism","title":"تکرار چگونه به شعر معنا می‌دهد؟","excerpt":"ردیف تنها آهنگ نیست؛ گاهی موتور اصلی شعر است.","body":"## هر بازگشت، یک تفاوت\nدر «بوی جوی مولیان آید همی»، ردیف احساسِ نزدیک شدن را زنده می‌کند. در «ای ساربان» تکرار «می‌رود» به جای نزدیک شدن، بر دور شدن تأکید دارد.\n\n## آزمایش ساده\nیک غزلِ ردیف‌دار را بخوانید و سپس ردیف را از پایانِ بیت‌ها بردارید. معمولاً چیزی بیش از آهنگ از دست می‌رود: جهت عاطفیِ متن تغییر می‌کند.\n\nردیفِ موفق صرفاً واژه‌ای چسبیده به پایان نیست. هر بیت آن را در معنایی تازه فعال می‌کند و در مجموع، ساختارِ درونی غزل را شکل می‌دهد.","person":"تحریریهٔ مریاد","source":"https://ganjoor.net/saadi/divan/ghazals/sh268","feature":false},{"id":"p27","cat":"criticism","title":"چگونه یک شعر را بدون زندگینامهٔ شاعر بخوانیم؟","excerpt":"از شواهد زبانی شروع کنیم، نه از حدس دربارهٔ زندگی نویسنده.","body":"## متن چه می‌گوید؟\nنخست گوینده، مخاطب، زمان و مکانِ شعر را پیدا کنید. آیا «من» شعر الزاماً خودِ شاعر تاریخی است؟ در بسیاری از آثار چنین نیست.\n\n## بعد سراغ زمینه برویم\nدانستنِ زندگی شاعر و موقعیت تاریخی می‌تواند خواندن را غنی کند، اما اگر از ابتدا هر تصویر را به یک حادثهٔ زندگینامه‌ای وصل کنیم، امکان‌های دیگرِ متن را می‌بندیم.\n\nروش عملی این است: یک‌بار شعر را بدون اطلاعات جانبی بخوانید و پرسش‌هایتان را بنویسید؛ سپس نسخه، واژه‌های دشوار و زمینهٔ تاریخی را بررسی کنید. در پایان ببینید کدام برداشت‌ها با شواهد تقویت یا رد شدند.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p28","cat":"learning","title":"غزل چیست؟","excerpt":"از ساختار بیت و قافیه تا نقشِ ردیف در غزل فارسی.","body":"## ساختار\nغزل معمولاً از چند بیت تشکیل می‌شود. در غزل سنتی، دو مصراعِ بیت نخست هم‌قافیه‌اند و سپس مصراع دومِ بیت‌های بعدی همان قافیه را تکرار می‌کند. اگر پس از قافیه عبارتی ثابت بیاید، به آن ردیف می‌گویند.\n\n## مطلع و مقطع\nبیت نخست «مطلع» نام دارد. به بیت پایانی «مقطع» می‌گویند؛ در بسیاری از غزل‌ها نامِ شعریِ شاعر یا تخلص در آن دیده می‌شود، اما حضور تخلص شرطِ ضروریِ همهٔ غزل‌ها نیست.\n\n## هنگام خواندن به چه دقت کنیم؟\nپیوند بیت‌ها همیشه داستانی و خطی نیست. ممکن است هر بیت استقلالی نسبی داشته باشد، اما تصویرها، لحن و تکرارهای آوایی میانشان رشته‌ای پنهان بسازد. غزل حافظ را یک‌بار برای هر بیت و بار دوم برای پیوند کل غزل بخوانید.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p29","cat":"learning","title":"رباعی و دوبیتی چه فرقی دارند؟","excerpt":"چهار مصراعِ مشابه، اما دو سنت وزنی متفاوت.","body":"## شکلِ ظاهری\nهر دو قالب معمولاً چهار مصراع دارند و در بسیاری از نمونه‌ها مصراع‌های اول، دوم و چهارم هم‌قافیه‌اند. بنابراین تنها از روی تعداد مصراع نمی‌توان آن‌ها را از هم تشخیص داد.\n\n## تفاوت اصلی: وزن\nرباعی در وزن‌های خانوادهٔ رباعی سروده می‌شود؛ دوبیتی در وزن معروفِ «مفاعیلن مفاعیلن فعولن» است. تشخیص قطعی نیازمند شنیدن یا تقطیعِ وزن است.\n\n## مثال برای تمرین\n«این قافلهٔ عمر عجب می‌گذرد» از نمونه‌های شناخته‌شدهٔ رباعی است. «ز دست دیده و دل هر دو فریاد» نمونه‌ای از دوبیتیِ باباطاهر است. هر دو را بلند بخوانید و به ضرباهنگِ متفاوت گوش کنید.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p30","cat":"learning","title":"قافیه و ردیف را یک‌بار درست یاد بگیریم","excerpt":"دو مفهوم نزدیک که کارکرد یکسانی ندارند.","body":"## قافیه\nقافیه بخشِ هم‌آواییِ پایانِ مصراع‌ها در جایگاه‌های مشخصِ قالب است. پیدا کردن آن نیازمند توجه به آواست، نه فقط شکل نوشتاری واژه‌ها.\n\n## ردیف\nردیف، واژه یا عبارتِ یکسانی است که پس از قافیه تکرار می‌شود. در غزل «ای ساربان»، عبارت «می‌رود» نقش ردیف را دارد و به حرکتِ پیوستهٔ شعر معنا می‌دهد.\n\n## تمرین\nپایانِ چند بیت از یک غزل را زیر هم بنویسید. بخشِ دقیقاً تکرارشونده را جدا کنید؛ سپس واژهٔ پیش از آن را بررسی کنید. با این روش معمولاً رابطهٔ قافیه و ردیف روشن می‌شود.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p31","cat":"learning","title":"وزن عروضی بدون ترس","excerpt":"از شنیدنِ ضرباهنگ آغاز کنیم، نه از جدول‌های پیچیده.","body":"## شعر را بشنویم\nوزن عروضی بر نظمِ هجاهای کوتاه و بلند استوار است. برای شروع، بهتر است یک مصراع را چند بار با صدای طبیعی بخوانید و به تکرارِ الگوی آوایی توجه کنید.\n\n## هجا چیست؟\nواژه‌ها به بخش‌های آوایی تقسیم می‌شوند. در تقطیع، شکلِ تلفظ‌شدهٔ واژه مهم است؛ گاهی آنچه می‌شنویم دقیقاً مطابق فاصله‌گذاری و صورتِ نوشتاری نیست.\n\n## یک قدم عملی\nدو مصراعِ متوالی از یک غزل کلاسیک را کنار هم بخوانید. اگر هر دو در یک الگوی منظم قرار می‌گیرند، ابتدا ریتم را با گوش ثبت کنید و سپس سراغ نامِ وزن و ارکان عروضی بروید. حفظِ نام‌ها بدون تمرین شنیداری معمولاً کمکِ چندانی نمی‌کند.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p32","cat":"learning","title":"استعاره و تشبیه در شعر","excerpt":"فرقِ گفتنِ «مانند» با ساختنِ یک جهان تصویری.","body":"## تشبیه\nدر تشبیه، چیزی با چیزی دیگر سنجیده می‌شود؛ گاهی نشانه‌ای مانند «چون» یا «مانند» وجود دارد. اما نشانهٔ تشبیه همیشه آشکار نیست.\n\n## استعاره\nدر استعاره، واژه یا تصویر از حوزه‌ای به حوزهٔ دیگر منتقل می‌شود و به جای آن می‌نشیند. وقتی در شعر عرفانی «نی» می‌تواند نشانهٔ انسانی جداافتاده باشد، متن از سطحِ ساز موسیقی فراتر می‌رود.\n\n## پرسشِ کاربردی\nبپرسید تصویر چه ویژگی‌ای را برجسته کرده است. اگر شاعر دل را «آینه» خوانده، آیا شفافیت، بازتاب، شکستنی بودن یا چیزی دیگر مهم است؟ پاسخ را جمله‌های اطرافِ تصویر تعیین می‌کنند.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p33","cat":"learning","title":"مجاز، کنایه و استعاره","excerpt":"سه راهِ گفتنِ چیزی به واسطهٔ چیزی دیگر.","body":"## مجاز\nدر مجاز، واژه بر پایهٔ رابطه‌ای شناخته‌شده به معنایی غیرمستقیم اشاره می‌کند؛ مثلاً نامِ مکان ممکن است به اهلِ آن مکان اشاره داشته باشد.\n\n## کنایه\nدر کنایه، عبارت معنای ظاهری دارد، اما مقصودِ تثبیت‌شده یا ضمنیِ دیگری نیز می‌رساند. برای فهم کنایه باید با کاربردِ فرهنگی آن آشنا بود.\n\n## استعاره\nاستعاره معمولاً بر شباهت و انتقالِ ویژگی‌ها متکی است. در عمل، مرزِ این صنایع در همهٔ نمونه‌ها کاملاً روشن نیست و طبقه‌بندی‌ها در کتاب‌های بلاغی تفاوت دارند.\n\nبه جای حفظ کردنِ صرفِ برچسب‌ها، توضیح دهید هر تعبیر چه اثری بر تصویر و لحن گذاشته است.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p34","cat":"learning","title":"چگونه یک غزل را دقیق بخوانیم؟","excerpt":"روشی پنج‌مرحله‌ای برای دور شدن از تعبیرهای شتاب‌زده.","body":"## یک: خواندن بی‌وقفه\nنخست غزل را از آغاز تا پایان بخوانید. لازم نیست همان بار اول معنای همهٔ واژه‌ها را بدانید. لحنِ عمومی و تصاویرِ تکرارشونده را بشنوید.\n\n## دو: واژه‌های دشوار\nمعنی واژه‌های کهن، کنایه‌ها و ارجاع‌های تاریخی را با فرهنگِ معتبر بررسی کنید. حدسِ امروزیِ واژه‌ها گاه گمراه‌کننده است.\n\n## سه: پیدا کردنِ محور\nردیف، مخاطب و تغییرِ لحن را علامت بزنید. آیا شاعر از امید به اضطراب می‌رسد؟ آیا میان بیت‌ها تقابلی تکرار می‌شود؟\n\n## چهار و پنج: نسخه و برداشت\nاگر متن مشهور است، اختلاف نسخه‌ها را ببینید. سپس تفسیر خود را با شواهدِ مشخصِ شعر بنویسید؛ تفسیری که نتوان برای آن مصراع آورد، هنوز نیازمند بازبینی است.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p35","cat":"learning","title":"چطور نقد ادبی بنویسیم؟","excerpt":"به جای تعریف یا تخریب، ادعایی روشن و قابل‌پیگیری بسازیم.","body":"## پرسش بسازید\nنقد خوب معمولاً با یک پرسش محدود شروع می‌شود: «ردیف در این غزل چه کار می‌کند؟» از ادعاهای بسیار بزرگ مثل «رازِ تمام شعر حافظ» دور شوید.\n\n## شاهد بیاورید\nهر داوری باید به واژه، تصویر، ساختار یا موقعیتِ متن وصل باشد. جملهٔ «شعر بسیار زیباست» به‌تنهایی نقد نیست؛ باید نشان دهید زیبایی در کجا و چگونه ساخته شده است.\n\n## مخالفت منصفانه\nیک خوانشِ بدیل را هم در نظر بگیرید. اگر امکانِ دیگری وجود دارد، بگویید چرا برداشتِ شما با شواهد سازگارتر است. نقدِ خوب لزوماً حکمِ قطعی نیست؛ روشی روشن برای اندیشیدن به متن است.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p36","cat":"learning","title":"شعر سپید چیست؟","excerpt":"وزنِ عروضی الزام نیست، اما زبان همچنان باید ساخته شود.","body":"## تعریف کوتاه\nشعر سپید در سنتِ شعر معاصر فارسی معمولاً به شعری گفته می‌شود که بر الگوی منظمِ وزنِ عروضی متکی نیست. حذفِ وزن به معنای حذفِ همهٔ شکل‌های موسیقی نیست.\n\n## ریتم از کجا می‌آید؟\nطولِ جمله‌ها، تکرارِ واژه‌ها، مکث، آواها و چینشِ سطرها می‌توانند ریتم بسازند. سطربندیِ خوب فقط قطع کردنِ نثر در چند جای تصادفی نیست.\n\n## یک تمرین\nیک بندِ کوتاه نثر بنویسید. سپس فقط جایی سطر را بشکنید که مکث یا تأکید معنایی ایجاد می‌شود. هر شکستِ سطر را توجیه کنید. اگر دلیلی ندارد، احتمالاً هنوز لازم نیست.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p37","cat":"learning","title":"شعر نیمایی با شعر سپید یکی نیست","excerpt":"از تحول وزن در شعر نو تا آزادی بیشترِ سطر.","body":"## شعر نیمایی\nدر شعر نیمایی، نظمِ عروضی به شکلی تازه سازمان می‌یابد؛ طولِ سطرها می‌تواند متفاوت باشد و قافیه دیگر الزاماً در جای ثابتِ قالب‌های سنتی نمی‌نشیند.\n\n## شعر سپید\nشعر سپید معمولاً از التزام به وزنِ عروضی فاصله می‌گیرد و موسیقی را از امکاناتِ دیگرِ زبان می‌گیرد.\n\n## چرا تفاوت مهم است؟\nبرچسبِ کلیِ «شعر نو» این دو شیوه را گاهی در هم می‌آمیزد. هنگام خواندن، به جای اتکا به اسمِ دوره، ببینید طولِ سطر، الگوی ریتم و قافیه واقعاً چگونه کار می‌کنند.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p38","cat":"learning","title":"چگونه شعر خودمان را ویرایش کنیم؟","excerpt":"چند پرسش ساده برای بازنویسیِ صادقانه‌تر شعر.","body":"## واژه‌های قابل حذف\nشعر را با صدای بلند بخوانید. هر جا واژه‌ای فقط برای پر کردنِ وزن یا زیباتر جلوه دادنِ عبارت آمده، آن را علامت بزنید.\n\n## تصویرهای مصرف‌شده\nاگر از «دریای غم» یا «گلِ عشق» استفاده کرده‌اید، بپرسید تصویر چه چیزی به شعر افزوده است. گاهی حذفِ استعارهٔ آماده و گفتنِ یک جزئیاتِ دقیق مؤثرتر است.\n\n## پایانِ شعر\nشعر را یک سطر پیش از پایانِ فعلی تمام کنید و مقایسه کنید. آیا سطرِ آخر معنایی را توضیح می‌دهد که خواننده پیش‌تر دریافته است؟ پایانِ خوب همیشه نتیجه‌گیری نیست.\n\nبازنویسی به معنای بی‌جان کردنِ متن نیست؛ راهی برای حفظ کردنِ بهترین انرژیِ آن است.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p39","cat":"learning","title":"تفاوت روایت و تصویر در شعر","excerpt":"چرا بعضی شعرها داستان می‌گویند و بعضی فقط صحنه می‌سازند؟","body":"## روایت\nروایت دگرگونیِ وضعیت در زمان را دنبال می‌کند: کسی می‌آید، چیزی رخ می‌دهد و پیامدی شکل می‌گیرد. مثنوی‌های داستانی نمونه‌های روشنی از ظرفیتِ روایی شعرند.\n\n## تصویر\nدر شعرِ تصویرمحور، ممکن است رخدادِ بزرگ و آشکاری وجود نداشته باشد. چند شیء، صدا یا رنگ در کنار هم تجربه‌ای واحد می‌سازند.\n\n## ترکیبِ دو شیوه\nبسیاری از شعرهای موفق از هر دو بهره می‌گیرند. در «ای ساربان»، کاروان واقعاً در حالِ رفتن است، اما تصاویرِ نیش، خون و آتش به حرکتِ سادهٔ داستان عمقِ عاطفی می‌دهند.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p40","cat":"learning","title":"ده پرسش برای خواندن یک شعر ناشناس","excerpt":"یک برگهٔ راهنما برای نخستین مواجهه با هر شعر.","body":"## پرسش‌ها\n- چه کسی در شعر سخن می‌گوید و مخاطبِ او کیست؟\n- زمان و مکان، مشخص‌اند یا مبهم؟\n- کدام واژه یا تصویر تکرار شده است؟\n- لحن از آغاز تا پایان تغییر می‌کند؟\n- چه چیزی گفته شده و چه چیزی عمداً ناگفته مانده است؟\n- شعر بر روایت تکیه دارد یا بر تصویر؟\n- آیا قافیه، ردیف یا ریتم در معنا دخالت دارد؟\n- کدام واژه ممکن است معنای تاریخیِ متفاوتی داشته باشد؟\n- چه خوانشِ دیگری از این سطرها ممکن است؟\n- برای دفاع از برداشت خود به کدام عبارت استناد می‌کنید؟\n\n## نتیجهٔ تمرین\nلازم نیست برای همهٔ پرسش‌ها پاسخی قطعی داشته باشید. هدف این است که از واکنشِ صرفِ «دوست داشتم» یا «نفهمیدم» به یک گفت‌وگوی دقیق‌تر با متن برسیم.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p41","cat":"learning","title":"تخلص در شعر فارسی چیست؟","excerpt":"نامی در پایانِ غزل و نقشی که گاه فراتر از امضا می‌رود.","body":"## نامِ شعری\nتخلص نام یا نشانی است که شاعر در بسیاری از غزل‌های سنتی به آن اشاره می‌کند. حافظ و سعدی نمونه‌های شناخته‌شده‌اند؛ با این حال همهٔ شعرها تخلص ندارند.\n\n## نقشِ نمایشی\nگاهی شاعر در بیت پایانی خودش را خطاب قرار می‌دهد، نصیحت می‌کند یا با خویش گفت‌وگو می‌کند. در این وضعیت، تخلص فقط امضا نیست؛ شخصیتی در خودِ شعر می‌شود.\n\n## هنگام خواندن\nببینید نام شاعر در پایان چه تغییری ایجاد می‌کند. آیا لحن صمیمی‌تر می‌شود؟ آیا نتیجه‌ای تازه می‌دهد یا زاویهٔ دید را عوض می‌کند؟","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p42","cat":"encyclopedia","title":"قالب‌های اصلی شعر فارسی","excerpt":"مروری فشرده بر غزل، قصیده، مثنوی، رباعی و دوبیتی.","body":"## غزل و قصیده\nهر دو قالب معمولاً بر قافیه‌آراییِ مشخصی استوارند، اما در سنت ادبی از نظر طول و کارکرد تاریخی تفاوت‌هایی دارند. غزل به‌ویژه در بیانِ تجربه‌های عاشقانه و عرفانی گسترش یافته است.\n\n## مثنوی\nدر مثنوی هر بیت قافیه‌ای جداگانه دارد. همین ویژگی سرودنِ روایت‌های بلند و منظومه‌های داستانی را آسان‌تر می‌کند؛ شاهنامه و مثنوی معنوی نمونه‌های برجسته‌اند.\n\n## رباعی و دوبیتی\nهر دو چهار مصراع دارند، اما الگوهای وزنی‌شان یکسان نیست. رباعیاتِ منسوب به خیام و دوبیتی‌های باباطاهر برای مقایسهٔ شنیداری مناسب‌اند.\n\nشناخت قالب نقطهٔ شروع است؛ کیفیتِ شعر را فقط نامِ قالب تعیین نمی‌کند.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p43","cat":"encyclopedia","title":"سبک خراسانی در یک نگاه","excerpt":"زبانی استوار، تصاویر محسوس و پیوند با دربار و روایت.","body":"## یک نامِ تاریخی\n«سبک خراسانی» عنوانی در تاریخ‌نگاریِ ادبی برای توصیفِ بسیاری از ویژگی‌های شعرِ دوره‌های نخستین فارسی دری است. این عنوان، همهٔ شاعران آن دوره را یکسان نمی‌کند.\n\n## ویژگی‌های مشهور\nواژگانِ نسبتاً مستقیم، توصیفِ طبیعت و جهانِ محسوس، استواریِ بیان و رواجِ قصیده از ویژگی‌هایی هستند که معمولاً برای این سبک برمی‌شمرند.\n\nبرای دیدنِ تنوع، رودکی را کنار فردوسی بگذارید: هر دو به دوره‌های کهن شعر فارسی تعلق دارند، اما یکی در قطعه‌ای کوتاه شوقِ بازگشت می‌سازد و دیگری جهانی روایی و حماسی می‌آفریند.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p44","cat":"encyclopedia","title":"سبک عراقی چیست؟","excerpt":"از غزل عاشقانه تا گسترش زبانِ عرفانی.","body":"## صورت‌بندیِ یک دوره\nدر پژوهش و آموزش تاریخ ادبیات، «سبک عراقی» معمولاً به بخشی از تحول شعر فارسی پس از دورهٔ خراسانی اشاره دارد. مرزها دقیق و دیواروار نیستند.\n\n## شعر چه تغییری می‌کند؟\nغزل برجستگی بیشتری پیدا می‌کند و تجربهٔ عاشقانه، عرفانی و اخلاقی در مرکزِ بسیاری از آثار قرار می‌گیرد. سعدی، مولانا و حافظ هر یک راهی متمایز در این افق دارند.\n\nاین نام را نباید به معنای محدود شدنِ جغرافیاییِ شعر به عراق امروز گرفت. نام‌گذاریِ سبک‌ها محصولِ تاریخِ نقد ادبی است.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p45","cat":"encyclopedia","title":"سبک هندی یا اصفهانی","excerpt":"باریک‌اندیشی و ارتباط‌های دور در تصویرپردازی.","body":"## نام‌ها و اختلاف‌ها\nدر منابع مختلف، برای این جریانِ گستردهٔ شعری اصطلاح‌هایی مانند «سبک هندی» و «سبک اصفهانی» به کار می‌رود. این نام‌گذاری‌ها همواره یکسان و بی‌بحث نیستند.\n\n## ویژگیِ مهم\nاز مشخصه‌های مشهورِ این شعر، مضمون‌سازی‌های دقیق و رابطه‌های غیرمنتظره میان اشیاست. یک تصویرِ روزمره می‌تواند به نتیجه‌ای ذهنی و پیچیده برسد.\n\nبرای خواندنِ این شعرها، به جای پرسیدنِ فوریِ «منظورش چیست؟»، ابتدا رابطهٔ اجزای تصویر را روی کاغذ رسم کنید. غالباً معنا از همان نسبتِ دور و شگفت پدید می‌آید.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p46","cat":"encyclopedia","title":"فرق شاعر، راوی و گویندهٔ شعر","excerpt":"سه واژه که در نقد ادبی نباید جای هم بنشینند.","body":"## شاعر\nشاعر فردِ تاریخیِ پدیدآورندهٔ اثر است. او زندگی، زمان و موقعیتِ اجتماعیِ مشخصی داشته است.\n\n## گویندهٔ شعر\n«من» در شعر لزوماً همان شاعرِ تاریخی نیست. ممکن است صدایی نمایشی، شخصیتی داستانی یا جایگاهی ساختگی باشد.\n\n## راوی\nدر آثارِ روایی، راوی کسی یا صدایی است که رخدادها را نقل می‌کند. گاهی راوی و شخصیتِ اصلی یکی‌اند و گاهی از هم جدا.\n\nاین تمایز جلوی یک خطای رایج را می‌گیرد: تبدیلِ هر سخنِ عاشقانه به گزارشِ مستقیم از زندگیِ شخصیِ شاعر.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p47","cat":"encyclopedia","title":"تصحیح انتقادی متن یعنی چه؟","excerpt":"چرا یک شعر در دو کتاب گاهی واژه‌های متفاوتی دارد؟","body":"## دست‌نویس‌ها یکسان نیستند\nآثارِ کهن در طولِ قرن‌ها رونویسی شده‌اند. کاتبان ممکن است واژه‌ای را متفاوت بخوانند، عبارتی را حذف کنند یا به خطا تغییر دهند.\n\n## کارِ مصحح\nمصحح متن، نسخه‌ها و شواهد تاریخی را می‌سنجد و می‌کوشد صورتِ معتبرتری از اثر ارائه کند. نتیجه همیشه قطعیتِ کامل نیست؛ گاهی اختلاف نسخه‌ها در حاشیه ثبت می‌شود.\n\n## برای خواننده\nوقتی میان دو صورتِ «بشنو این نی» و «بشنو از نی» اختلاف می‌بینید، بهتر است ابتدا نامِ تصحیح و شواهد آن را جست‌وجو کنید. محبوبیتِ یک صورت به‌تنهایی دلیلِ اصالت آن نیست.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p48","cat":"encyclopedia","title":"ردیف چه نقشی در موسیقی شعر دارد؟","excerpt":"واژهٔ تکرارشونده‌ای که می‌تواند لحن و معنا را اداره کند.","body":"## تعریف\nردیف در شعرِ سنتی واژه یا عبارتی است که پس از قافیه با همان صورت تکرار می‌شود. قافیه و ردیف به هم نزدیک‌اند، اما یکی نیستند.\n\n## فراتر از صدا\nدر غزل «ای ساربان»، بازگشتِ «می‌رود» حسِ رفتن را تقویت می‌کند. در شعر رودکی، «آید همی» حرکتی در جهتِ آمدن و نزدیک شدن می‌سازد.\n\nبنابراین هنگام بررسیِ موسیقیِ شعر، فقط به خوش‌آهنگی اکتفا نکنیم؛ ببینیم تکرار چه چیزی را در ذهن خواننده تثبیت می‌کند.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p49","cat":"encyclopedia","title":"مطلع، مقطع و بیت‌الغزل","excerpt":"چند اصطلاح مهم برای خواندنِ غزل.","body":"## مطلع\nمطلع بیتِ آغازِ غزل است و معمولاً هر دو مصراعش قافیهٔ غزل را دارند. شروعِ قوی می‌تواند لحن و انتظارِ خواننده را تنظیم کند.\n\n## مقطع\nمقطع بیتِ پایانی غزل است. گاهی در آن تخلص می‌آید، اما این قاعده فراگیر نیست.\n\n## بیت‌الغزل\n«بیت‌الغزل» را برای بیتِ برجسته و درخشانِ یک غزل به کار می‌برند؛ تعیینِ آن همیشه داوریِ قطعی و موردِ اتفاقِ همهٔ خوانندگان نیست.\n\nاین اصطلاح‌ها ابزارِ توصیف‌اند، نه معیارِ خودکارِ ارزش‌گذاری.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p50","cat":"encyclopedia","title":"ادبیات تعلیمی چه ویژگی‌هایی دارد؟","excerpt":"جایی که داستان یا شعر با اندیشهٔ اخلاقی و تربیتی همراه می‌شود.","body":"## هدفِ آموزشی در اثر\nدر ادبیات تعلیمی، متن با مسئله‌هایی مانند اخلاق، رفتار، خرد، تدبیر و شیوهٔ زندگی درگیر است. «تعلیمی» بودن الزاماً به معنای خشک بودنِ زبان نیست.\n\n## مثال‌ها\nحکایت‌های گلستان سعدی اغلب صحنه و گفت‌وگو را با اندیشه‌ای اخلاقی پیوند می‌زنند. قصیده‌های ناصرخسرو نیز می‌توانند لحنی مستقیم و استدلالی داشته باشند.\n\nبرای نقدِ این آثار باید دو موضوع را جدا کرد: کیفیتِ هنریِ بیان و درستی یا نادرستیِ اندیشهٔ مطرح‌شده در موقعیتِ تاریخیِ آن.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p51","cat":"encyclopedia","title":"منظومه و مثنوی چه نسبتی دارند؟","excerpt":"نامِ یک نوع اثر در برابر نامِ قالبِ قافیه‌پردازی.","body":"## مثنوی؛ قالب\nمثنوی قالبی است که در آن هر بیت قافیهٔ مستقل دارد. این شیوه برای روایتِ بلند کارآمد است.\n\n## منظومه؛ اثر\nمنظومه به یک اثرِ پیوستهٔ شعری گفته می‌شود. بسیاری از منظومه‌های داستانیِ فارسی در قالبِ مثنوی سروده شده‌اند، اما این دو واژه از نظرِ مفهومی کاملاً مترادف نیستند.\n\nمثلاً «لیلی و مجنون» نظامی یک منظومهٔ روایی است که در قالب مثنوی سروده شده. توجه به این تمایز در معرفی دقیقِ کتاب‌ها کمک می‌کند.","person":"تحریریهٔ مریاد","source":"","feature":false},{"id":"p52","cat":"poets","title":"حافظ شیرازی؛ شاعر چندمعنایی","excerpt":"نگاهی کوتاه به غزل‌های حافظ و هنرِ باز گذاشتنِ معنا.","body":"## در کانون غزل فارسی\nخواجه شمس‌الدین محمد حافظ، شاعر سدهٔ هشتم هجری، با غزل‌هایی شناخته می‌شود که زبانِ عاشقانه، عرفانی و انتقادی را در کنار هم می‌نشانند. شیراز از مهم‌ترین جایگاه‌های زندگی و شعرِ اوست.\n\n## از کجا شروع کنیم؟\nغزل نخستِ دیوان، «الا یا ایها الساقی»، برای شناختِ لحنِ پرکشمکشِ او مناسب است. سپس «سال‌ها دل طلب جام جم» نشان می‌دهد که چگونه تصویرِ اسطوره‌ای می‌تواند وارد گفت‌وگویی درونی شود.\n\n## هنگام مطالعه\nبه نسخه و تصحیحِ دیوان توجه کنید. اختلاف ضبطِ بیت‌ها و نیز چندمعناییِ واژه‌ها بخش مهمی از خواندنِ حافظ است.","person":"حافظ","source":"https://ganjoor.net/hafez/ghazal","feature":false},{"id":"p53","cat":"poets","title":"سعدی؛ استادِ نثر و غزل","excerpt":"از فشردگیِ گلستان تا موسیقیِ غزل عاشقانه.","body":"## دو چهرهٔ هم‌زمان\nسعدی شیرازی، شاعر و نویسندهٔ سدهٔ هفتم هجری، در گلستان به نثری آهنگین و حکایت‌هایی کوتاه و در بوستان به شعری روایی و تعلیمی دست یافت.\n\n## غزل‌های سعدی\nدر غزل «ای ساربان آهسته رو»، تجربهٔ فراق با صحنه‌ای روشن و موسیقیِ روان همراه می‌شود. سادگیِ بیان در این‌جا حاصلِ ساختاری دقیق است، نه فقدانِ ظرافت.\n\nبرای ورود به جهان سعدی، خواندنِ یکی از حکایت‌های گلستان در کنار یک غزل، تصویری کامل‌تر از توانِ زبانیِ او می‌دهد.","person":"سعدی","source":"https://ganjoor.net/saadi","feature":false},{"id":"p54","cat":"poets","title":"فردوسی؛ راویِ جهانِ پهلوانی","excerpt":"خالق شاهنامه و شاعرِ سرنوشت و انتخاب.","body":"## شاهنامه\nابوالقاسم فردوسی، شاعرِ توس و از چهره‌های بزرگِ شعر حماسیِ فارسی، عمرِ خلاقهٔ خود را صرفِ شکل دادن به روایت‌های گستردهٔ اساطیری و تاریخیِ ایران کرد.\n\n## زبان و اندیشه\nقدرتِ روایت، نام‌گذاریِ دقیقِ کنش‌ها و حضورِ پرسش‌هایی دربارهٔ خرد، بخت، وفاداری و مرگ از ویژگی‌های ماندگارِ شاهنامه است.\n\nبرای آغاز، پس از دیباچهٔ «به نام خداوند جان و خرد»، یکی از داستان‌های مستقلِ شاهنامه را با توجه به تصمیم‌های شخصیت‌ها بخوانید.","person":"فردوسی","source":"https://ganjoor.net/ferdousi/shahname","feature":false},{"id":"p55","cat":"poets","title":"مولانا؛ از نی تا شورِ غزل","excerpt":"دو صدای متفاوت در مثنوی و دیوان شمس.","body":"## مثنوی\nجلال‌الدین محمد بلخی، مشهور به مولانا، در مثنوی از قصه، گفت‌وگو و تمثیل برای پرداختن به مسائلِ عمیقِ انسانی و عرفانی استفاده می‌کند.\n\n## دیوان شمس\nغزل‌های او اغلب ضرباهنگِ تندی دارند و از تکرار، خطابِ مستقیم و تصویرهای پرتحرک بهره می‌برند. «آمد بهار جان‌ها» نمونه‌ای شنیدنی از این انرژی است.\n\nآغازِ مثنوی با نی و غزل‌های دیوان شمس را کنار هم بخوانید تا تفاوتِ دو شیوهٔ بیان او روشن شود.","person":"مولانا","source":"https://ganjoor.net/moulavi","feature":false},{"id":"p56","cat":"poets","title":"خیام؛ چهار مصراع برای پرسش‌های بزرگ","excerpt":"رباعی، زمان و مسئلهٔ انتساب.","body":"## نامِ خیام\nعمر خیام نیشابوری دانشمند و شاعرِ شناخته‌شدهٔ ایرانی است. رباعیاتِ منسوب به او از مشهورترین متن‌های فارسی دربارهٔ گذر زمان، ناپایداری و نسبتِ انسان با جهان‌اند.\n\n## مسئلهٔ متن\nهمهٔ رباعی‌های منتشرشده به نامِ خیام از نظر انتساب یکسان نیستند. گزیده‌ها و تصحیح‌های مختلف، تعداد و متنِ رباعیات متفاوتی دارند.\n\nبرای شروع، رباعی «این قافلهٔ عمر عجب می‌گذرد» را بخوانید و به تکرارِ فعلِ پایانی گوش کنید.","person":"خیام","source":"https://ganjoor.net/khayyam/robaee","feature":false},{"id":"p57","cat":"poets","title":"رودکی؛ صدای آغازین شعر فارسی","excerpt":"از جغرافیای بخارا تا موسیقیِ «آید همی».","body":"## در آغازِ سنتِ فارسی دری\nرودکی، از چهره‌های بزرگِ شعرِ دورهٔ سامانی، جایگاهی اساسی در تاریخِ شعر فارسی دری دارد. بخشِ مهمی از آثارِ او به‌صورتِ پراکنده به ما رسیده است.\n\n## شعرِ ماندگار\n«بوی جوی مولیان» نشان می‌دهد چگونه واژه‌های ساده، نامِ مکان‌ها و ردیفی خوش‌آهنگ می‌توانند تصویری نیرومند از اشتیاقِ بازگشت بسازند.\n\nبرای شناخت رودکی باید هم شعرهای باقی‌مانده و هم فاصلهٔ ما با مجموعهٔ کاملِ ازدست‌رفتهٔ آثارِ او را در نظر داشت.","person":"رودکی","source":"https://ganjoor.net/roodaki","feature":false},{"id":"p58","cat":"poets","title":"عطار نیشابوری؛ سفر در زبانِ تمثیل","excerpt":"چرا منطق‌الطیر فراتر از یک داستانِ پرندگان است؟","body":"## شاعرِ حکایت و سفر\nعطار نیشابوری از چهره‌های اثرگذارِ شعر عرفانیِ فارسی است. منطق‌الطیر او سفری روایی را به بستری برای گفت‌وگو دربارهٔ ترس، طلب و شناخت بدل می‌کند.\n\n## از کجا بخوانیم؟\nبهتر است پیش از رسیدن به شرحِ نمادها، خودِ داستان را دنبال کنید: پرندگان چه می‌خواهند و چه چیزی مانعِ حرکتشان می‌شود؟\n\nآغازِ منطق‌الطیر و سپس گفت‌وگوهای داستانیِ آن، خواننده را با زبانِ تمثیلیِ عطار آشنا می‌کند.","person":"عطار","source":"https://ganjoor.net/attar/manteghotteyr","feature":false},{"id":"p59","cat":"poets","title":"نظامی گنجوی؛ معمارِ منظومهٔ داستانی","excerpt":"از لیلی و مجنون تا هنرِ صحنه‌پردازی.","body":"## داستان در قالبِ شعر\nنظامی گنجوی، شاعرِ سدهٔ ششم هجری، به‌ویژه با منظومه‌های داستانیِ خمسه شناخته می‌شود. شخصیت‌پردازی، وصف و پرداختِ گفت‌وگو از توانایی‌های برجستهٔ اوست.\n\n## آغازِ لیلی و مجنون\n«ای نام تو بهترین سرآغاز» دیباچه‌ای خوش‌آهنگ است که از نخستین بیت، لحن و ساختارِ موسیقاییِ اثر را مشخص می‌کند.\n\nخواندنِ آثار نظامی تنها دنبال کردنِ داستان نیست؛ جزئیاتِ تصویر و چگونگیِ حرکتِ صحنه‌ها نیز به همان اندازه اهمیت دارند.","person":"نظامی","source":"https://ganjoor.net/nezami/5ganj/leyli-majnoon","feature":false}]</script>
<script>

const CATS={poetry:'شعر کلاسیک',criticism:'نقد و خوانش',learning:'کارگاه شعر',encyclopedia:'دانشنامه',poets:'چهره‌ها'};

const FEED=(()=>{const fresh=POSTS.filter(p=>p.publishedAt).sort((a,b)=>String(b.publishedAt).localeCompare(String(a.publishedAt)));const groups={};const cats=['poetry','criticism','learning','encyclopedia','poets'];for(const c of cats)groups[c]=POSTS.filter(p=>p.cat===c&&!p.publishedAt);const out=[];const count=Math.max(...cats.map(c=>groups[c].length));for(let i=0;i<count;i++)for(const c of cats)if(groups[c][i])out.push(groups[c][i]);return [...fresh,...out]})();

const norm=s=>String(s||'').replace(/[ي]/g,'ی').replace(/[ك]/g,'ک').replace(/[ًٌٍَُِّْٔ]/g,'').replace(/\u200c/g,'').toLocaleLowerCase('fa').trim();
const reading=p=>{const words=p.body.trim().split(/\s+/).length;return Math.max(2,Math.round(words/160))+' دقیقه مطالعه'};
const label=p=>CATS[p.cat]||'مجله';
const link=p=>'#/article/'+p.id;
function markupCard(p,i){return `<a class="article-card" href="${link(p)}"><span class="num" aria-hidden="true">${String(i+1).padStart(2,'0')}</span><span class="story-type">${label(p)}</span><h3>${esc(p.title)}</h3><p>${esc(p.excerpt)}</p><div class="card-foot"><span>${esc(p.person)} · ${reading(p)}</span><span class="arrow" aria-hidden="true">↖</span></div></a>`}
function filtersMarkup(selected='all'){return `<div class="filters" role="group" aria-label="دسته‌بندی مطالب">${ORDER.map(c=>`<button class="pill ${c===selected?'active':''}" type="button" data-filter="${c}" aria-pressed="${c===selected}">${c==='all'?'همهٔ مطالب':CATS[c]}</button>`).join('')}</div>`}
function archiveControls(){return `<div class="archive-toolbar">${filtersMarkup(activeCat)}<label class="search-box"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="postSearch" type="search" placeholder="جست‌وجو در عنوان، شعر و نویسنده..." autocomplete="off" value="${esc(query)}" aria-label="جست‌وجوی مطالب"></label></div><p id="resultCount" class="archive-count"></p><div id="postGrid" class="article-grid"></div><div class="more-row" id="moreRow"></div>`}
function wireFilters(){document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{const c=btn.dataset.filter;query='';if(location.hash==='#/'||location.hash===''){if(c==='all'){activeCat='all';shown=LIMIT;updateGrid();return}}location.hash=c==='all'?'#/archive':'#/category/'+c}));const input=document.getElementById('postSearch');if(input){input.addEventListener('input',e=>{query=e.target.value;shown=LIMIT;updateGrid()})}}
function updateGrid(){const visible=FEED.filter(p=>(activeCat==='all'||p.cat===activeCat)&&(!query||norm(p.title+' '+p.excerpt+' '+p.person+' '+p.body).includes(norm(query))));let grid=document.getElementById('postGrid');if(!grid)return;document.getElementById('resultCount').textContent=`${visible.length.toLocaleString('fa-IR')} مطلب`+(query?' برای جست‌وجوی شما':' در آرشیو');grid.innerHTML=visible.length?visible.slice(0,shown).map(markupCard).join(''):'<div class="empty-state">مطلبی با این جست‌وجو پیدا نشد. عبارت دیگری امتحان کنید.</div>';let more=document.getElementById('moreRow');more.innerHTML=visible.length>shown?'<button id="loadMore" class="outline-btn">نمایش مطالب بیشتر ↓</button>':'';document.getElementById('loadMore')?.addEventListener('click',()=>{shown+=LIMIT;updateGrid()});document.querySelectorAll('[data-filter]').forEach(b=>{let ok=b.dataset.filter===activeCat;b.classList.toggle('active',ok);b.setAttribute('aria-pressed',ok)})}
function featureLink(p,big){if(big)return `<a class="feature-big" href="${link(p)}"><span class="story-type">${label(p)}</span><h3>${esc(p.title)}</h3><p>${esc(p.excerpt)}</p><span class="read-arrow">مطالعهٔ مطلب ←</span></a>`;return `<a href="${link(p)}"><div><span class="story-type">${label(p)}</span><span class="item-title">${esc(p.title)}</span></div><span class="tiny-symbol" aria-hidden="true">↖</span></a>`}
function home(){document.title='مریاد | آکادمی شعر و ادبیات';activeCat='all';query='';shown=LIMIT;const picks=[POSTS[0],POSTS.find(p=>p.cat==='criticism'),POSTS.find(p=>p.cat==='learning'),POSTS.find(p=>p.cat==='poets')];MAIN.innerHTML=`<section class="hero"><div class="container hero-in"><div><h1>مریاد</h1><p class="hero-sub">آکادمی شعر و ادبیات</p><p class="hero-full">مجمع روایت، یادمان، ادبیات و داوری</p><div class="hero-en">MARYAD</div></div><div class="hero-art"><div class="poem-preview"><div class="poem-line">بنی‌آدم اعضای یکدیگرند</div><div class="poem-line">که در آفرینش ز یک گوهرند</div><small><a href="#/article/p04">سعدی · گلستان</a></small></div></div></div></section><section class="section"><div class="container"><div class="section-top"><div><p class="section-label">از مجلهٔ مریاد</p><h2 class="section-title">گزیدهٔ مریاد</h2></div><a class="text-link" href="#/archive">همهٔ مطالب ←</a></div><div class="feature-grid">${featureLink(picks[0],true)}<div class="feature-side">${picks.slice(1).map(p=>featureLink(p,false)).join('')}</div></div></div></section><section class="section archive-wrap"><div class="container"><div class="section-top"><div><p class="section-label">آرشیو</p><h2 class="section-title">تازه‌ترین مطالب</h2><p class="section-note">شعر، نقد، خوانش و مقاله؛ همه در یک‌جا.</p></div></div>${archiveControls()}</div></section><section class="collection-band"><div class="container"><p class="section-label">بخش‌ها</p><h2 class="section-title">در مریاد بخوانید</h2><div class="collection-row">${ORDER.filter(x=>x!=='all').map(c=>`<a class="collection" href="#/category/${c}"><span class="star" aria-hidden="true">✧</span><strong>${CATS[c]}</strong><span>${POSTS.filter(x=>x.cat===c).length.toLocaleString('fa-IR')} مطلب</span></a>`).join('')}</div></div></section><section class="award-banner"><div class="container award-in"><div><small>MARYAD LITERARY PRIZE</small><h2>نشان مریاد</h2><p>بخشی مستقل برای جایزهٔ ادبی مریاد؛ فراخوان‌ها، شیوهٔ انتخاب و برگزیدگان پس از اعلام رسمی در همین بخش منتشر خواهند شد.</p><a href="#/award" class="award-link">آشنایی با نشان مریاد ←</a></div><div class="awardsymbol" aria-hidden="true">✦</div></div></section>`;wireFilters();updateGrid()}
function listing(c){activeCat=CATS[c]?c:'all';query='';shown=LIMIT;const name=activeCat==='all'?'همهٔ مطالب':CATS[activeCat];document.title=name+' | مریاد';MAIN.innerHTML=`<section class="page-intro"><div class="container"><div class="breadcrumb"><a href="#/">خانه</a><span> / </span>${activeCat==='all'?'آرشیو':`<a href="#/archive">آرشیو</a><span> / </span>${name}`}</div><h1>${name}</h1><p>${activeCat==='all'?'آرشیو شعرها، مقاله‌های ادبی، نقدها و یادداشت‌های مریاد.':({poetry:'برگزیده‌ای از اشعار کلاسیک همراه با خوانش کوتاه و ارجاع به متن اصلی.',criticism:'یادداشت‌های تحلیلی دربارهٔ شعر، روایت، زبان و تجربهٔ خواندن.',learning:'راهنماهای روشن و کاربردی برای فهم دقیق‌تر شعر و فنون ادبی.',encyclopedia:'اصطلاحات، قالب‌ها و جریان‌های مهم ادبیات فارسی.',poets:'آشنایی کوتاه با شاعرانی که زبان فارسی را شکل داده‌اند.'}[activeCat]||'')}</p></div></section><section class="section archive-wrap"><div class="container">${archiveControls()}</div></section>`;wireFilters();updateGrid();if(location.hash==='#/archive'&&window.__focusSearch){setTimeout(()=>document.getElementById('postSearch')?.focus(),80);window.__focusSearch=false}}
function renderBody(source){let out='';const segments=source.trim().split(/(::[\s\S]*?::)/g);segments.forEach(segment=>{const s=segment.trim();if(!s)return;if(s.startsWith('::')&&s.endsWith('::')){out+=`<div class="verse-block" lang="fa">${esc(s.slice(2,-2).trim())}</div>`;return}const chunks=s.split(/\n\s*\n/);chunks.forEach(c=>{c=c.trim();if(!c)return;if(c.startsWith('## ')){out+=`<h2>${esc(c.slice(3))}</h2>`}else if(c.startsWith('- ')){out+='<ul>'+c.split('\n').map(t=>`<li>${esc(t.replace(/^\-\s*/,''))}</li>`).join('')+'</ul>'}else{out+=`<p>${esc(c)}</p>`}})});return out}
function article(id){const p=POSTS.find(p=>p.id===id);if(!p){notFound();return}document.title=p.title+' | مریاد';const related=POSTS.filter(a=>a.cat===p.cat&&a.id!==p.id).slice(0,5);MAIN.innerHTML=`<section class="page-intro"><div class="container"><div class="breadcrumb"><a href="#/">خانه</a><span>/</span><a href="#/category/${p.cat}">${label(p)}</a><span>/</span><span>${esc(p.title)}</span></div><div class="story-type">${label(p)}</div><h1>${esc(p.title)}</h1><p>${esc(p.excerpt)}</p><div class="meta-row"><span>${esc(p.person)}</span><span>${reading(p)}</span></div></div></section><div class="container reading-layout"><article class="prose"><div class="article-topline">مریاد / ${label(p)}</div>${renderBody(p.body)}${p.source?`<div class="source-box">${p.cat==='poetry'?'مأخذ و متن کاملِ شعر':'متن اصلیِ مورد اشاره'}: <a target="_blank" rel="noopener noreferrer" href="${esc(p.source)}">مطالعه در گنجور ↗</a><br><span class="subtle">در آثارِ کلاسیک، میان نسخه‌ها و تصحیح‌ها ممکن است تفاوت‌هایی وجود داشته باشد.</span></div>`:'<div class="source-box">این یادداشت از مطالب تحریریهٔ مریاد است.</div>'}<div class="copy-row"><button id="copyLink" class="copybtn" type="button">کپی پیوند مطلب</button><a class="text-link" href="#/archive">بازگشت به آرشیو ←</a></div></article><aside class="aside"><h4>بیشتر بخوانید</h4>${related.map(a=>`<a href="${link(a)}">${esc(a.title)}<small>${label(a)}</small></a>`).join('')}<div class="article-back"><a class="text-link" href="#/category/${p.cat}">همهٔ ${label(p)} ←</a></div></aside></div>`;document.getElementById('copyLink').addEventListener('click',async()=>{const url=location.href;try{await navigator.clipboard.writeText(url);document.getElementById('copyLink').textContent='پیوند کپی شد ✓'}catch(e){window.prompt('پیوند مطلب را کپی کنید:',url)}})}
function award(){document.title='نشان مریاد | مریاد';MAIN.innerHTML=`<section class="page-intro"><div class="container"><div class="breadcrumb"><a href="#/">خانه</a><span>/</span>نشان مریاد</div><div class="eyebrow">MARYAD LITERARY PRIZE</div><h1>نشان مریاد</h1><p>بخش ویژهٔ جوایز و رویدادهای ادبی آکادمی.</p></div></section><div class="container plain-wrap"><p>نشان مریاد برای معرفی و ارج‌گذاری به آثارِ شاخصِ شعر و ادبیات در نظر گرفته شده است. برنامهٔ نخستین دوره، شرایط شرکت و ترکیبِ هیئت داوران پس از نهایی شدن منتشر می‌شود.</p><div class="award-steps"><div><span>01</span><h3>فراخوان</h3><p>انتشار شرایط، تقویم و روش ارسال آثار.</p></div><div><span>02</span><h3>انتخاب و داوری</h3><p>معرفی معیارها، داوران و نامزدها.</p></div><div><span>03</span><h3>برگزیدگان</h3><p>اعلام نتایج و ثبت دوره‌ها در آرشیو.</p></div></div><h2>وضعیت فعلی</h2><p class="note">نخستین دوره هنوز اعلام نشده است. در این نسخه هیچ تاریخ، برنده یا داوری به‌صورت فرضی ثبت نشده است.</p><a href="#/archive" class="text-link">مطالعهٔ مجلهٔ مریاد ←</a></div>`}
function about(){document.title='دربارهٔ مریاد | مریاد';MAIN.innerHTML=`<section class="page-intro"><div class="container"><div class="breadcrumb"><a href="#/">خانه</a><span>/</span>درباره</div><h1>دربارهٔ مریاد</h1><p>مریاد · آکادمی شعر و ادبیات · مجمع روایت، یادمان، ادبیات و داوری</p></div></section><div class="container plain-wrap"><p>مریاد، مجمع روایت، یادمان، ادبیات و داوری، بستری برای خواندن، بررسی و معرفی شعر و ادبیات است: از متن‌های کلاسیک و یادداشت‌های انتقادی تا دانشنامه و پرونده‌های شاعران.</p><h2>مجلهٔ ادبی</h2><p>مطالب سایت در بخش‌های شعر کلاسیک، نقد و خوانش، کارگاه شعر، دانشنامه و چهره‌ها گرد آمده‌اند. هر شعر کلاسیک به مأخذِ بررسی‌شده پیوند دارد و یادداشت‌های تحلیلی این نسخه برای مریاد نوشته شده‌اند.</p><h2>نشان مریاد</h2><p>بخش جایزهٔ ادبی برای فراخوان‌ها و معرفی برگزیدگان پیش‌بینی شده است؛ اطلاعات رسمی آن در مرحلهٔ بعد منتشر می‌شود.</p><h2>دربارهٔ این نسخه</h2><p class="note">آرشیو مریاد شامل مطالب تحریریه و شعرهای منتخب از منابع مشخص است. مطالب تازه از سوی سردبیر خودکار به آرشیو افزوده می‌شوند و در هر مطلب می‌توانید مأخذ آن را ببینید.</p><a href="#/archive" class="text-link">رفتن به آرشیو ←</a></div>`}
function notFound(){document.title='صفحه پیدا نشد | مریاد';MAIN.innerHTML=`<div class="container plain-wrap"><h1>صفحه پیدا نشد</h1><p>نشانی واردشده در آرشیو مریاد نیست.</p><a class="text-link" href="#/">بازگشت به خانه ←</a></div>`}
function route(){const hash=decodeURIComponent(location.hash.replace(/^#\/?/,''));document.getElementById('navlinks').classList.remove('open');document.getElementById('mobileToggle').setAttribute('aria-expanded','false');if(hash===''||hash==='/')home();else{const bits=hash.replace(/^\//,'').split('/');if(bits[0]==='archive')listing('all');else if(bits[0]==='category')listing(bits[1]);else if(bits[0]==='article')article(bits[1]);else if(bits[0]==='award')award();else if(bits[0]==='about')about();else notFound()}document.querySelectorAll('.navlinks a').forEach(a=>a.removeAttribute('aria-current'));let current=[...document.querySelectorAll('.navlinks a')].find(a=>a.getAttribute('href')===location.hash);if(current)current.setAttribute('aria-current','page');window.scrollTo({top:0,behavior:'instant'});document.getElementById('progress').style.width='0%'}
document.getElementById('mobileToggle').addEventListener('click',()=>{const menu=document.getElementById('navlinks');const isOpen=menu.classList.toggle('open');document.getElementById('mobileToggle').setAttribute('aria-expanded',isOpen)});document.querySelector('.search-shortcut').addEventListener('click',()=>{window.__focusSearch=true;if(location.hash==='#/archive')setTimeout(()=>document.getElementById('postSearch')?.focus(),20)});window.addEventListener('hashchange',route);window.addEventListener('scroll',()=>{let max=document.documentElement.scrollHeight-window.innerHeight;document.getElementById('progress').style.width=(max>0?Math.min(100,window.scrollY/max*100):0)+'%'},{passive:true});route();
</script>
</body></html>
